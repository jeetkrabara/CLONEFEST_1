<!DOCTYPE html>
<html>
<head><title>SecureBin Crypto Test</title></head>
<body>
  <h1>Open the console (F12) to test</h1>
   <script type="module">
  import { buildEnvelope, openEnvelope, SecretAccessError } from './crypto/index.js';

  // Build a secret containing something that should trigger analysis
  const envelope = await buildEnvelope(
    "password: hunter2",
    [{ label: "Alice", password: "alicePw123" }]
  );
  console.log("Envelope built:", envelope);
  console.log("Has encryptedAnalysis?", !!envelope.encryptedAnalysis);

  // --- Mock server, no view limit ---
  const mockFetch = async (secretId, viewerLabel) => ({
    status: 200,
    ok: true,
    json: async () => ({
      ciphertext: envelope.ciphertext,
      iv: envelope.iv,
      encryptedAnalysis: envelope.encryptedAnalysis,
      analysisIv: envelope.analysisIv,
      wrapData: envelope.viewers[0]
    })
  });

  // Access with correct password — should return { plaintext, analysis }
  try {
    const result = await openEnvelope("fakeId", "Alice", "alicePw123", mockFetch);
    console.log("Decrypted plaintext:", result.plaintext);
    console.log("Decrypted analysis:", JSON.stringify(result.analysis));
  } catch (e) {
    console.log("Error:", e.code, e.message);
  }

  // Wrong password should still fail cleanly
  try {
    await openEnvelope("fakeId", "Alice", "wrongPassword", mockFetch);
  } catch (e) {
    console.log("Wrong password error:", e.code, e.message);
  }
</script>
</html>
